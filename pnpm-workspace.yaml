packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@coursebuilder/adapter-drizzle": link:.local/course-builder/packages/adapter-drizzle
  "@coursebuilder/commerce": link:.local/course-builder/packages/commerce
  "@coursebuilder/core": link:.local/course-builder/packages/core
  "@coursebuilder/email": link:.local/course-builder/packages/email
  "@coursebuilder/next": link:.local/course-builder/packages/next
  "@coursebuilder/server": link:.local/course-builder/packages/server
  "@coursebuilder/ui": link:.local/course-builder/packages/ui
  "@coursebuilder/utils": link:.local/course-builder/packages/coursebuilder-utils
  "@coursebuilder/video-processing": link:.local/course-builder/packages/video-processing
  "@internationalized/date": "3.12.2"

onlyBuiltDependencies:
  - "@swc/core"
  - "esbuild"
  - "protobufjs"
  - "sharp"
  - "typesense-instantsearch-adapter"
  - "workerd"
allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  typesense-instantsearch-adapter: true
  workerd: true
minimumReleaseAgeExclude:
  - "@typescript/native-preview-darwin-arm64@7.0.0-dev.20260607.1"
  - "@typescript/native-preview-darwin-x64@7.0.0-dev.20260607.1"
  - "@typescript/native-preview-linux-arm64@7.0.0-dev.20260607.1"
  - "@typescript/native-preview-linux-arm@7.0.0-dev.20260607.1"
  - "@typescript/native-preview-linux-x64@7.0.0-dev.20260607.1"
  - "@typescript/native-preview-win32-arm64@7.0.0-dev.20260607.1"
  - "@typescript/native-preview-win32-x64@7.0.0-dev.20260607.1"
  - "@typescript/native-preview@7.0.0-dev.20260607.1"
  - "@coursebuilder/*"
